<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Classroom Hub{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --primary-color: #4a90e2;
            --sidebar-bg: #ffffff;
        }
        body {
            background-color: #f4f7f6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: white !important;
            border-bottom: 1px solid #dee2e6;
            z-index: 1030;
            height: 60px;
        }
        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color) !important;
        }
        /* Layout fix to prevent horizontal scroll */
        .content-wrapper {
            overflow-x: hidden;
            min-height: calc(100vh - 60px);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-door-open-fill me-2"></i>Classroom Hub
            </a>
            <div class="ms-auto d-flex align-items-center">
                {% if session.get('username') %}
                    <a class="btn btn-sm btn-outline-danger px-3 rounded-pill" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="btn btn-sm btn-primary px-4 rounded-pill" href="{{ url_for('login') }}">Sign In</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container-fluid content-wrapper">
        <div class="row">

            <!-- Main Content Area -->
            <!-- We add 'admin' to this list so it takes up the full 12 columns -->
          <main class="col-12 px-md-4">
                {% block content %}
                {% endblock %}
            </main>
            
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
