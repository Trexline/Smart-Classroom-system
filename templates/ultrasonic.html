{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4 px-0 px-md-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 fw-bold mb-0 text-dark">Ultrasonic Distance Monitor</h1>
            <p class="text-muted small mb-0">Logged in as: <span class="fw-bold text-primary">{{ session.username }}</span></p>
        </div>
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
            <i class="bi bi-broadcast me-1"></i> Live
        </span>
    </div>

    <div class="row g-3">

        <!-- Gauge Card -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-body d-flex flex-column justify-content-between">

                    <!-- Value -->
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold mb-1">Object Distance</h6>
                            <h2 class="fw-bold mb-0" id="dist-value">-- cm</h2>
                        </div>
                        <div style="width:52px; height:52px; background:#e7f6f8; border-radius:50%; display:flex; align-items:center; justify-content:center;">
                            <i class="bi bi-arrows-expand text-info fs-3"></i>
                        </div>
                    </div>

                    <!-- Visual bar -->
                    <div>
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span>0 cm</span>
                            <span>200 cm</span>
                            <span>400 cm</span>
                        </div>
                        <div class="position-relative" style="height:36px; background:#f1f3f5; border-radius:8px; border:1px solid #dee2e6; overflow:hidden;">
                            <!-- Filled bar -->
                            <div id="dist-bar"
                                 style="position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,#0dcaf0,#0d6efd); border-radius:8px; transition: width 0.4s ease-in-out;">
                            </div>
                            <!-- Pointer label -->
                            <div id="dist-label"
                                 style="position:absolute; top:50%; transform:translateY(-50%); left:4px; font-size:0.72rem; font-weight:bold; color:#fff; pointer-events:none;">
                                --
                            </div>
                        </div>
                    </div>

                    <!-- Status -->
                    <div class="mt-3 p-2 rounded bg-light">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small text-muted">Status:</span>
                            <span id="dist-status" class="badge rounded-pill bg-success">Waiting...</span>
                        </div>
                    </div>

                    <!-- Last updated -->
                    <p class="text-muted small mt-2 mb-0 text-end">
                        Updated: <span id="last-updated">--</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-4 h-100">
                <div class="card-header bg-white py-3 border-0">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-graph-up text-info me-2"></i>Distance Trend (Last 20 Readings)
                    </h5>
                </div>
                <div class="card-body" style="position:relative; height:220px;">
                    <canvas id="distChart"></canvas>
                </div>
            </div>
        </div>

    </div>
</div>

<style>
    .blink { animation: blinker 1s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // --- Chart setup ---
    const ctx = document.getElementById('distChart').getContext('2d');
    const distChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Distance (cm)',
                data: [],
                borderColor: '#0dcaf0',
                backgroundColor: '#0dcaf022',
                fill: true,
                tension: 0.4,
                borderWidth: 2,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 300 },
            layout: { padding: 0 },
            plugins: {
                legend: { display: false },
                tooltip: { mode: 'index', intersect: false }
            },
            scales: {
                x: { display: false },
                y: {
                    beginAtZero: true,
                    max: 400,
                    grid: { color: 'rgba(0,0,0,0.05)' },
                    ticks: { maxTicksLimit: 5, callback: v => v + ' cm' }
                }
            }
        }
    });

    // --- UI update function ---
    function updateUI(cm, history) {
        // Main value
        const val = cm !== null && cm !== undefined ? cm.toFixed(1) : null;
        document.getElementById('dist-value').textContent = val ? val + ' cm' : '-- cm';

        // Bar
        const pct = val ? Math.min((cm / 400) * 100, 100) : 0;
        document.getElementById('dist-bar').style.width = pct + '%';
        document.getElementById('dist-label').textContent = val ? val + ' cm' : '--';

        // Status badge
        const statusEl = document.getElementById('dist-status');
        if (val === null) {
            statusEl.textContent = 'No Data';
            statusEl.className = 'badge rounded-pill bg-secondary';
        } else if (cm < 30) {
            statusEl.textContent = 'Too Close!';
            statusEl.className = 'badge rounded-pill bg-danger blink';
        } else if (cm < 100) {
            statusEl.textContent = 'Object Detected';
            statusEl.className = 'badge rounded-pill bg-warning text-dark';
        } else if (cm < 250) {
            statusEl.textContent = 'In Range';
            statusEl.className = 'badge rounded-pill bg-info text-dark';
        } else {
            statusEl.textContent = 'Clear';
            statusEl.className = 'badge rounded-pill bg-success';
        }

        // Timestamp
        const now = new Date();
        document.getElementById('last-updated').textContent =
            now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Chart
        if (history && history.length) {
            distChart.data.labels = history.map((_, i) => i + 1);
            distChart.data.datasets[0].data = history;
            distChart.update('none');
        }
    }

    // --- Poll every 1 second ---
    async function fetchData() {
        try {
            const res = await fetch('/api/ultrasonic_live');
            if (!res.ok) return;
            const d = await res.json();
            updateUI(d.dist, d.dist_history);
        } catch (e) {
            console.warn('Fetch failed:', e);
        }
    }

    fetchData(); // Run immediately on load
    setInterval(fetchData, 1000);
</script>
{% endblock %}
